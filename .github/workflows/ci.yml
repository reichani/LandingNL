name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --keep-vars

  staging-d1-activation:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'migration/cloudflare-dashboard-v1.0.4' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:staging
      - name: Verify required staging tables
        run: >-
          npx wrangler d1 execute DB
          --env staging
          --remote
          --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('users', 'sessions', 'email_login_tokens', 'user_state', 'regulatory_rules') ORDER BY name;"
