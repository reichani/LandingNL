name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --keep-vars

  staging-ux-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: https://landingnl-staging.reichani.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy --dry-run --keep-vars --env staging
      - run: npm run deploy:staging
      - name: Smoke test staging
        run: |
          curl --fail --silent --show-error "$STAGING_URL/" >/dev/null
          curl --fail --silent --show-error "$STAGING_URL/login" >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$STAGING_URL/dashboard")" = "303"
