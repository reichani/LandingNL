name: LandingNL v2 CI

on:
  pull_request:
  push:
    branches:
      - feat/v2-pages-d1

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Typecheck v2 app
        run: bun run typecheck

      - name: Permanent v2 architecture and UX gates
        run: bun run quality

      - name: Syntax-check Pages Functions
        run: find functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build static Pages app
        run: bun run build

      - name: Assert deploy artifact
        run: test -f dist/index.html
