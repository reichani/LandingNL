name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --keep-vars

  staging-account-resume:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_URL: https://landingnl-staging.reichani.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy --dry-run --env staging --keep-vars
      - run: npm run db:migrate:staging
      - name: Verify account resume column
        run: >-
          npx wrangler d1 execute DB
          --env staging
          --remote
          --command "SELECT name FROM pragma_table_info('users') WHERE name = 'onboarding_completed_at';"
      - run: npm run deploy:staging
      - name: Smoke public and protected routes
        shell: bash
        run: |
          curl --fail --silent --show-error "$STAGING_URL/" >/dev/null
          curl --fail --silent --show-error "$STAGING_URL/login" >/dev/null
          headers="$(curl --silent --show-error --dump-header - --output /dev/null "$STAGING_URL/dashboard" | tr -d '\r')"
          printf '%s\n' "$headers" | grep -Eq '^HTTP/[0-9.]+ 303'
          printf '%s\n' "$headers" | grep -Fqi "location: $STAGING_URL/login"
          printf '%s\n' "$headers" | grep -Eqi '^cache-control: no-store$'
