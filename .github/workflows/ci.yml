name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --keep-vars

  smoke-staging-worker:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'migration/cloudflare-dashboard-v1.0.4' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_URL: https://landingnl-staging.reichani.workers.dev
    steps:
      - name: Smoke public routes
        run: |
          curl --fail --silent --show-error "$STAGING_URL/" >/dev/null
          curl --fail --silent --show-error "$STAGING_URL/login" >/dev/null
      - name: Verify dashboard remains protected
        shell: bash
        run: |
          headers="$(curl --silent --show-error --dump-header - --output /dev/null "$STAGING_URL/dashboard" | tr -d '\r')"
          printf '%s\n' "$headers" | grep -Eq '^HTTP/[0-9.]+ 303'
          printf '%s\n' "$headers" | grep -Fqi "location: $STAGING_URL/login"
          printf '%s\n' "$headers" | grep -Eqi '^cache-control: no-store$'
