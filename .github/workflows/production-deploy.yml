name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landingnl-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://landingnl.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --env production --keep-vars
      - name: Apply production D1 migrations (no-op when already applied)
        run: npm run db:migrate:production
      - name: Record rollback point
        run: npx wrangler deployments list --env production | head -n 20 || true
      - run: npm run deploy:production
      - name: Smoke public routes
        run: |
          sleep 10
          curl --fail --silent --show-error "$PRODUCTION_URL/" | grep -q 'journey-start'
          curl --fail --silent --show-error "$PRODUCTION_URL/login" | grep -q 'privacy-link'
          curl --fail --silent --show-error "$PRODUCTION_URL/privacy" | grep -q 'Veri sorumlusu'
          curl --fail --silent --show-error "$PRODUCTION_URL/robots.txt" | grep -q 'Disallow: /dashboard'
      - name: Verify the retired phone/SMS prototype is gone
        run: |
          if curl --silent "$PRODUCTION_URL/" | grep -q 'SMS Doğrulama'; then
            echo "Prototype still served"; exit 1
          fi
      - name: Verify dashboard remains protected
        shell: bash
        run: |
          headers="$(curl --silent --show-error --dump-header - --output /dev/null "$PRODUCTION_URL/dashboard" | tr -d '\r')"
          printf '%s\n' "$headers" | grep -Eq '^HTTP/[0-9.]+ 303'
          printf '%s\n' "$headers" | grep -Fqi "location: $PRODUCTION_URL/login"
